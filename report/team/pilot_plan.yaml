    - "Chi phí mỗi việc thành công theo loại: noi_dia 2.696 đ (0,22x, simulated), hang_nang 8.221 đ (0,69x, simulated), doi_tac 10.215 đ (0,85x, simulated), quoc_te 22.515 đ (1,88x, simulated)"
    - "Chi phí mỗi việc thành công phạm vi noi_dia + hang_nang: biến đổi 3.414 đ (simulated); cộng cố định 40 triệu đ/tháng là 4.599 đ = 0,38x ở 45.000 YC/tháng và 5.784 đ = 0,48x ở 22.500 YC/tháng (simulated)"
    - "Chi phí xem lại 100% phạm vi noi_dia + hang_nang (B4): 11.743 đ = 0,98x với 9 phút làm lại (simulated) và 12.414 đ / 12.415 đ = 1,03x với 15,3 phút làm lại (simulated)"
